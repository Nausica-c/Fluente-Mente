<!-- SEO CORE -->
<title>
  {% if page.title %}{{ page.title }} | Fluente-Mente{% else %}Fluente-Mente | Impara l’inglese in modo semplice{% endif %}
</title>

<meta name="description" content="{{ page.description | default: site.description }}" />

<link rel="canonical" href="{{ page.url | absolute_url }}" />

<meta name="robots" content="index, follow" />

<!-- LANGUAGE (base, espandibile multi-language) -->
<meta http-equiv="content-language" content="{{ page.language | default: 'it' }}" />

<!-- OPEN GRAPH -->
<meta property="og:type" content="article" />
<meta property="og:title" content="{{ page.title }}" />
<meta property="og:description" content="{{ page.description }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:site_name" content="Fluente-Mente" />

{% if page.image %}
<meta property="og:image" content="{{ page.image }}" />
{% endif %}

<!-- TWITTER CARD -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.title }}" />
<meta name="twitter:description" content="{{ page.description }}" />

{% if page.image %}
<meta name="twitter:image" content="{{ page.image }}" />
{% endif %}

<!-- FAVICON -->
<link rel="icon" href="/assets/images/favicon.png" />

<!-- PRECONNECT (performance) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- STRUCTURED DATA BASE (ARTICLES) -->
{% if page.layout == "post" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ page.title }}",
  "description": "{{ page.description }}",
  "url": "{{ page.url | absolute_url }}",
  "author": {
    "@type": "Organization",
    "name": "Fluente-Mente"
  }
}
</script>
{% endif %}
