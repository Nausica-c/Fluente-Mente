---
layout: default
---

<section class="pillar">

  <div class="page__container">

    <!-- 🧠 HERO -->
    <header class="pillar-hero">

      <h1>{{ page.title }}</h1>

      {% if page.description %}
      <p>
        {{ page.description }}
      </p>
      {% endif %}

    </header>

    <!-- 📚 CONTENUTO -->
    <div class="pillar-content">
      {{ content }}
    </div>

  </div>

</section>
