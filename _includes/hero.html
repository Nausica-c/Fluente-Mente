<header class="post-hero">

  <h1>{{ page.title }}</h1>

  {% if page.description %}
    <p class="post-subtitle">
      {{ page.description }}
    </p>
  {% endif %}

  {% if page.image %}
    <img src="{{ page.image }}"
         alt="{{ page.title }}"
         class="post-image">
  {% endif %}

  {% include post-meta.html %}

</header>
