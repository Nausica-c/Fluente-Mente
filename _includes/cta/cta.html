{% assign cluster = page.cluster %}
{% assign cta = site.data.cta[cluster] %}

<div class="cta-box">

  <h3>
    {{ cta.title }}
  </h3>

  <p>
    {{ cta.description }}
  </p>

  <a href="{{ site.data.affiliates.babbel.url }}"
     class="cta-button cta-{{ cta.intensity }}"
     target="_blank"
     rel="sponsored noopener nofollow">

    {{ cta.button }}

  </a>

</div>
