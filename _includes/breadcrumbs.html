<nav class="breadcrumbs">

  <a href="{{ site.baseurl }}/">
    Home
  </a>

  {% if page.language %}
    ›
    <a href="{{ site.baseurl }}/{{ page.language }}/">
      {{ page.language | capitalize }}
    </a>
  {% endif %}

  {% if page.cluster %}
    ›
    <a href="{{ site.baseurl }}/{{ page.language }}/{{ page.cluster }}/">
      {{ page.cluster | replace: "-", " " | capitalize }}
    </a>
  {% endif %}

  {% if page.title %}
    ›
    <span>{{ page.title }}</span>
  {% endif %}

</nav>
