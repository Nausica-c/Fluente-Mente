<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- =========================
  TITLE
  ========================= -->
  <title>
    {% if page.title %}
      {{ page.title }} | FluenteMente
    {% else %}
      FluenteMente | Impara le lingue in modo intelligente
    {% endif %}
  </title>

  <!-- =========================
  DESCRIPTION
  ========================= -->
  <meta name="description" content="{{ page.description | default: 'Impara l’inglese e altre lingue con metodi pratici, mindset e percorsi guidati. FluenteMente ti accompagna verso la fluidità reale.' }}">

  <!-- =========================
  CSS
  ========================= -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- =========================
  SEO BASE
  ========================= -->
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- =========================
  OPEN GRAPH (Pinterest + Social)
  ========================= -->
  <meta property="og:title" content="{{ page.title | default: 'FluenteMente' }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="FluenteMente">

  {% if page.image %}
    <meta property="og:image" content="{{ page.image }}">
  {% endif %}

  <!-- Pinterest Rich Pins -->
  <meta name="pinterest-rich-pin" content="true">

  <!-- =========================
  TWITTER CARD
  ========================= -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: 'FluenteMente' }}">
  <meta name="twitter:description" content="{{ page.description }}">

  {% if page.image %}
    <meta name="twitter:image" content="{{ page.image }}">
  {% endif %}

  <!-- =========================
  BABBEL TRACKING BASE
  ========================= -->
  <script>
    window.fluentemente = {
      source: "{{ page.source | default: 'seo' }}",
      cluster: "{{ page.cta | default: page.categories[1] }}"
    };
  </script>

</head>
