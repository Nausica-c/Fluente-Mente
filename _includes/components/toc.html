<!-- 📚 TABLE OF CONTENTS -->

<nav class="toc">

  <p class="toc__title">
    {{ include.title | default: "Contenuti" }}
  </p>

  <ul class="toc__list">
    {% for item in include.items %}
      <li class="toc__item">
        <a href="#{{ item.id }}">
          {{ item.title }}
        </a>
      </li>
    {% endfor %}
  </ul>

</nav>
