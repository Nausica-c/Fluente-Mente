<!-- 🌍 LANGUAGE CARD -->

<div class="card language-card">

  <h3>
    {{ include.language }}
  </h3>

  {% if include.description %}
  <p>
    {{ include.description }}
  </p>
  {% endif %}

  <a href="{{ include.url }}" class="btn btn-primary">
    {{ include.cta | default: "Scopri" }}
  </a>

</div>
