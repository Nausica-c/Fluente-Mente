<!-- 📣 CTA BANNER -->

<section class="cta-banner">

  <div class="cta-banner__content">

    <h2>
      {{ include.title | default: "Inizia a parlare davvero" }}
    </h2>

    <p>
      {{ include.text | default: "Allenati con lezioni brevi e pratiche." }}
    </p>

    <a href="{{ include.url | default: '#' }}" class="btn btn-primary">
      {{ include.button | default: "Inizia ora" }}
    </a>

  </div>

</section>
