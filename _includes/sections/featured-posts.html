<!-- ⭐ FEATURED POSTS -->

<section class="featured-posts">

  <div class="page__container">

    {% if include.title %}
    <h2 class="section-title__heading">
      {{ include.title }}
    </h2>
    {% endif %}

    <div class="featured-posts__grid">

      {% for post in include.posts %}

        {% include components/article-card.html
          title=post.title
          url=post.url
          excerpt=post.excerpt
        %}

      {% endfor %}

    </div>

  </div>

</section>
