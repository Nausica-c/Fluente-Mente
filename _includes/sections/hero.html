<!-- 🚀 HERO SECTION -->

<section class="hero">

  <div class="page__container">

    <h1 class="hero__title">
      {{ include.title }}
    </h1>

    {% if include.subtitle %}
    <p class="hero__subtitle">
      {{ include.subtitle }}
    </p>
    {% endif %}

    {% if include.cta %}
    <div class="hero__cta">
      {{ include.cta }}
    </div>
    {% endif %}

  </div>

</section>
