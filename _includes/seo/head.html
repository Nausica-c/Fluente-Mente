<meta charset="UTF-8" />
<title>
  {% if page.title %}
    {{ page.title }} | Fluente-Mente
  {% else %}
    Fluente-Mente - Impara inglese in modo semplice
  {% endif %}
</title>

<meta name="description" content="{{ page.description | default: site.description }}" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- CANONICAL -->
<link rel="canonical" href="{{ page.url | absolute_url }}" />

<!-- ROBOTS -->
<meta name="robots" content="index, follow" />

<!-- OPEN GRAPH -->
<meta property="og:title" content="{{ page.title }}" />
<meta property="og:description" content="{{ page.description }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:type" content="article" />

<!-- TWITTER -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.title }}" />
<meta name="twitter:description" content="{{ page.description }}" />

<!-- LANGUAGE SYSTEM -->
{% assign lang = page.language | default: "it" %}
<meta http-equiv="content-language" content="{{ lang }}" />

<!-- HREFLANG MULTI-LANGUAGE READY -->
{% if site.data.languages %}
  {% for l in site.data.languages %}
    <link rel="alternate" hreflang="{{ l[1].hreflang }}"
      href="{{ l[1].path | absolute_url }}" />
  {% endfor %}
{% endif %}

<!-- CLUSTER SEMANTIC SIGNAL -->
{% if page.cluster %}
  <meta name="article:section" content="{{ site.data.clusters[page.cluster].label }}" />
  <meta name="topic" content="{{ site.data.clusters[page.cluster].label }}" />
{% endif %}

<!-- ENTITY SEO (CORE UPGRADE) -->
{% if page.entities %}
  {% for entity in page.entities %}
    <meta name="entity" content="{{ site.data.entities[entity].label }}" />
  {% endfor %}
{% endif %}

<!-- PUBLISHER -->
<meta name="author" content="Fluente-Mente" />

<!-- STRUCTURED SEO SIGNAL -->
<meta name="site_name" content="Fluente-Mente" />
