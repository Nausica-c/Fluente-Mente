{% assign cluster = page.cluster %}

{% assign related = site.posts
  | where: "cluster", cluster
  | sample: 3 %}

<div class="auto-links">

  <h3>📚 Continua nel cluster</h3>

  {% for post in related %}

    {% unless post.url == page.url %}

      <a href="{{ post.url }}">
        {{ post.title }}
      </a>

    {% endunless %}

  {% endfor %}

</div>
