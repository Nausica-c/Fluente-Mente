<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",

  "headline": "{{ page.title | escape }}",

  {% if page.description %}
  "description": "{{ page.description | escape }}",
  {% else %}
  "description": "{{ site.description | escape }}",
  {% endif %}

  "author": {
    "@type": "Organization",
    "name": "Fluente-Mente"
  },

  "publisher": {
    "@type": "Organization",
    "name": "Fluente-Mente"
  },

  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}{{ page.url }}"
  },

  "url": "{{ site.url }}{{ page.url }}",

  {% if page.image %}
  "image": "{{ site.url }}{{ site.baseurl }}{{ page.image }}",
  {% endif %}

  {% if page.date %}
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}"
  {% endif %},

  "inLanguage": "{{ page.language | default: 'it' }}",

  "articleSection": "{{ page.cluster }}"
}
</script>
