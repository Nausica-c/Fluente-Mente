<header class="site-header">

  <div class="container header-inner">

    <!-- =========================
         LOGO
         ========================= -->

    <a href="{{ site.baseurl }}/" class="logo">
      Fluente<span>-Mente</span>
    </a>

    <!-- =========================
         NAVIGATION (SEO WEIGHTED)
         ========================= -->

    <nav class="main-nav">

      {% assign sorted_nav = site.navigation | sort: "weight" | reverse %}

      {% for item in sorted_nav %}

        {% if item.primary == true %}

          <a href="{{ site.baseurl }}{{ item.url }}">
            {{ item.title }}
          </a>

        {% endif %}

      {% endfor %}

    </nav>

    <!-- =========================
         CTA (CONVERSION FOCUS)
         ========================= -->

    <div class="header-cta">

      <a href="{{ site.data.affiliates.babbel.url }}"
         class="cta-primary"
         target="_blank"
         rel="sponsored noopener nofollow">

        {{ site.data.affiliates.babbel.label }}

      </a>

    </div>

  </div>

</header>
