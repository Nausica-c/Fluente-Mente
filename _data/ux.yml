layout:

  reading_mode: "scannable"

  typography:
    font_size: "large_readable"
    line_height: "comfortable"
    paragraph_length: "short"

  spacing:
    section_gap: "large"
    paragraph_gap: "medium"

cta_behavior:

  frequency: "balanced"
  placement:
    - "after_intro"
    - "mid_content"
    - "end"

  style:
    primary: "high_contrast_button"
    secondary: "soft_link"

mobile:

  priority: "content_first"
  sticky_cta: true
  reduce_noise: true

user_flow:

  goal: "read → understand → act"

  friction_points:
    - "remove long blocks of text"
    - "use headers every 3-4 paragraphs"
    - "insert examples frequently"

pinterest_integration:

  visibility: "post_end_only"
  format: "card_based"

conversion_design:

  mindset: "soft persuasion"
  trust_first: true
  aggressive_selling: false
