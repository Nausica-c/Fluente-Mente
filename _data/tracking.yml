  utm:
    source: "fluente-mente"
    medium: "cta"
    campaign: "babbel_affiliate"
    content: "cluster_based"

cta_rules:
  position_1: "after_intro"
  position_2: "mid_content"
  position_3: "end_of_article"

pinterest:
  utm_medium: "pinterest"
  utm_campaign: "pin_traffic"
  tracking_param: "pin_id"

clusters:
  speaking:
    cta_strength: "high"
    conversion_intent: "very_high"

  beginner:
    cta_strength: "medium"
    conversion_intent: "high"

  mindset:
    cta_strength: "soft"
    conversion_intent: "emotional"

a_b_testing:
  enabled: true
  variants:
    - "cta_soft"
    - "cta_direct"
    - "cta_emotional"
